name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package (strip + tarball)
        run: |
          strip target/release/shotori
          mkdir dist
          cp target/release/shotori LICENSE dist/
          mkdir -p dist/assets dist/scripts
          cp -r assets/app dist/assets/
          cp assets/shotori.desktop dist/assets/
          cp scripts/install-desktop.sh scripts/generate-icons.py dist/scripts/
          tar -C dist -czf "shotori-${GITHUB_REF_NAME}-x86_64.tar.gz" shotori LICENSE assets scripts

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball-linux
          path: shotori-*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux

      - name: Create release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(ls shotori-*.tar.gz)
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "${GITHUB_REF_NAME}" $ARTIFACTS \
              --title "shotori ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" $ARTIFACTS \
              --title "shotori ${GITHUB_REF_NAME}" --generate-notes
          fi

  aur:
    # Publishes the fork's own AUR package (shotori-clipboard-uri-list),
    # which ships the clipboard text/uri-list patch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux
          path: artifact

      - name: Push PKGBUILD to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git openssh
          install -dm700 /root/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          cat > /root/.ssh/config <<'SSHEOF'
          Host aur.archlinux.org
              User aur
              IdentityFile /root/.ssh/aur
              IdentitiesOnly yes
          SSHEOF
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          git config --global user.name "shotori-release-bot"
          git config --global user.email "go1em@users.noreply.github.com"
          git clone ssh://aur@aur.archlinux.org/shotori-clipboard-uri-list.git aur
          cd aur
          TAG="${GITHUB_REF_NAME}"
          PKGVER="${TAG#v}"
          PKGVER="${PKGVER%%-*}"
          SHA=$(sha256sum "../artifact/shotori-${TAG}-x86_64.tar.gz" | cut -d' ' -f1)
          cat > PKGBUILD <<'PKGEOF'
          # Maintainer: guohw <go1em>
          pkgname=shotori-clipboard-uri-list
          pkgver=__PKGVER__
          pkgrel=1
          pkgdesc="Screenshot tool fork: the clipboard also offers text/uri-list and text/html so X11 clients can paste large images"
          arch=('x86_64')
          url="https://github.com/go1em/shotori"
          license=('MIT')
          depends=('gcc-libs' 'libxcb' 'libxau' 'libxdmcp' 'libxkbcommon')
          provides=('shotori')
          conflicts=('shotori' 'shotori-git' 'shotori-bin')
          source=("$url/releases/download/__TAG__/shotori-__TAG__-x86_64.tar.gz")
          sha256sums=('__SHA__')

          package() {
            install -Dm755 shotori "$pkgdir/usr/bin/shotori"
            install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
            install -Dm644 assets/shotori.desktop "$pkgdir/usr/share/applications/shotori.desktop"
            for icon in assets/app/shotori-*.png; do
              size=$(basename "$icon" .png); size=${size#shotori-}
              install -Dm644 "$icon" "$pkgdir/usr/share/icons/hicolor/${size}x${size}/apps/shotori.png"
            done
            install -Dm644 assets/app/shotori.svg "$pkgdir/usr/share/icons/hicolor/scalable/apps/shotori.svg"
          }
          PKGEOF
          sed -i "s/__PKGVER__/${PKGVER}/; s/__TAG__/${TAG}/; s/__SHA__/${SHA}/" PKGBUILD
          useradd -m builder
          install -d -o builder -g builder /home/builder/work
          cp PKGBUILD /home/builder/work/
          su builder -s /bin/bash -c "cd ~/work && makepkg --printsrcinfo" > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "shotori-clipboard-uri-list ${PKGVER}-1"
          git push
  crates-io:
    # Publishes to crates.io. Requires CARGO_REGISTRY_TOKEN (crates.io/settings/tokens,
    # publish-new + publish-update scopes) — a missing token FAILS the job:
    # a silent skip once shipped a "released" version that never reached
    # the registry.
    if: false  # fork build: no AUR/registry credentials here
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies the tarball by building it — the same
      # native deps the build job needs (gpui → fontconfig/xkbcommon)
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set — add it in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          cargo publish --token "$TOKEN"
